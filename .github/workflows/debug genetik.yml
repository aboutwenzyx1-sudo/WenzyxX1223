name: Build APK - Debug Genetik

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nama Project'
        required: true
        default: 'MyAppGenetik'

jobs:
  build-debug-genetik:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Debug (Split ABI)
        run: flutter build apk --debug --split-per-abi

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk output/${{ github.event.inputs.project_name }}-arm32-debug.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk output/${{ github.event.inputs.project_name }}-arm64-debug.apk
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk output/${{ github.event.inputs.project_name }}-x86-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_name }}-debug-genetik
          path: output/*.apk
          retention-days: 7
